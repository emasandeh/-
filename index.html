<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>AI Learning Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🧠 منصة التعلم الذكي</h1>

<div class="grid">

  <!-- AI Assistant -->
  <div class="card">
    <h2>🤖 المساعد الذكي</h2>
    <textarea id="aiInput" placeholder="اسأل أي سؤال..."></textarea>
    <button onclick="askAI()">اسأل</button>
    <div id="aiOut"></div>
  </div>

  <!-- Practice -->
  <div class="card">
    <h2>📚 بنك التمارين</h2>
    <div id="bank"></div>
  </div>

  <!-- Quiz -->
  <div class="card">
    <h2>🧪 اختبار سريع</h2>
    <button onclick="startQuiz()">ابدأ الاختبار</button>
    <div id="quiz"></div>
    <h3 id="score"></h3>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
